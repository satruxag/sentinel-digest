[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-digest"
version = "0.1.0"
description = "Raccoglie bandi e avvisi pubblici, filtra per parole chiave, invia un digest. Self-hosted, senza dipendenze obbligatorie."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rss", "bandi", "gare", "digest", "self-hosted", "sme", "italia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# Nessuna dipendenza obbligatoria: solo stdlib.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
sentinel-digest = "sentinel_digest.cli:main"

[project.urls]
Homepage = "https://github.com/satruxag/sentinel-digest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]